[project]
name = "book-companion"
version = "0.1.0"
description = "EPUB conversion, spoiler-bounded search and a local viewer for the Book Companion library"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.3",
]

[project.scripts]
book-search = "book_companion.search.cli:main"
book-convert = "book_companion.convert.cli:main"
book-view = "book_companion.view.cli:main"
book-library = "book_companion.library.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
