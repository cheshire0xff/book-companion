[project]
name = "book-companion"
version = "0.1.0"
description = "Spoiler-bounded tools for the Book Companion library"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
book-search = "book_companion.search.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
